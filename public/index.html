<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>iPhone 18 Profit Watch</title>
  <style>
    :root { font-family: Inter, system-ui, Arial, sans-serif; color-scheme: dark; }
    body { margin:0; background:#101318; color:#f2f5f7; }
    .wrap { max-width:1240px; margin:auto; padding:28px 16px; }
    .top { display:flex; gap:16px; justify-content:space-between; align-items:center; flex-wrap:wrap; }
    h1 { margin:0 0 8px; font-size:28px; letter-spacing:0; }
    .muted { color:#9aa4af; }
    button { background:#2f7d68; color:white; border:0; border-radius:8px; padding:11px 16px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .panel { margin-top:22px; border:1px solid #27313c; border-radius:8px; overflow:hidden; background:#151a21; }
    table { width:100%; border-collapse:collapse; min-width:920px; }
    th, td { padding:13px 14px; border-bottom:1px solid #27313c; text-align:left; white-space:nowrap; }
    th { font-size:12px; text-transform:uppercase; color:#aeb8c3; background:#1b222b; }
    tr:last-child td { border-bottom:0; }
    .scroll { overflow:auto; }
    .price { font-weight:800; }
    .profit { font-weight:900; }
    .positive { color:#43d39e; }
    .negative { color:#ff7b86; }
    a { color:#77bdfb; text-decoration:none; }
    .empty, .err { padding:18px; }
    .err { border-top:1px solid #4e242b; background:#2a1519; color:#ffb4bd; }
    code { background:#202833; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>iPhone 18 Profit Watch</h1>
      <div id="updated" class="muted">Dang tai...</div>
    </div>
    <button id="checkBtn">Kiem tra ngay</button>
  </div>

  <div class="panel">
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Model</th>
            <th>Shop thu mua</th>
            <th>Gia Apple</th>
            <th>Gia thu mua</th>
            <th>Tien lai</th>
            <th>Cap nhat</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="empty muted" style="display:none"></div>
    <div id="errors"></div>
  </div>
</div>

<script>
function yen(n){
  return n == null ? "N/A" : "¥" + Number(n).toLocaleString("ja-JP");
}

function profitClass(n){
  if (n == null) return "";
  return n >= 0 ? "positive" : "negative";
}

async function load(){
  const res = await fetch("/api/prices");
  const data = await res.json();
  const rows = data.rows || [];
  document.getElementById("updated").textContent =
    data.updatedAt ? "Cap nhat: " + new Date(data.updatedAt).toLocaleString("vi-VN")
                   : "Chua co du lieu. Bam kiem tra ngay.";

  const body = document.getElementById("rows");
  const empty = document.getElementById("empty");
  const errors = document.getElementById("errors");
  body.innerHTML = "";
  errors.innerHTML = "";
  empty.style.display = rows.length ? "none" : "block";
  empty.innerHTML = rows.length ? "" : "Chua tim thay gia iPhone 18. Kiem tra <code>sources.json</code> hoac website nguon.";

  rows.forEach((row, index) => {
    body.insertAdjacentHTML("beforeend", `
      <tr>
        <td>#${index + 1}</td>
        <td><strong>${row.model}</strong> ${row.storage}</td>
        <td>${row.shop}</td>
        <td class="price">${yen(row.applePrice)}</td>
        <td class="price">${yen(row.buyPrice)}</td>
        <td class="profit ${profitClass(row.profit)}">${row.profit == null ? "N/A" : (row.profit >= 0 ? "+" : "") + yen(row.profit)}</td>
        <td class="muted">${new Date(row.checkedAt).toLocaleString("vi-VN")}</td>
        <td><a href="${row.url}" target="_blank" rel="noreferrer">Mo trang</a></td>
      </tr>
    `);
  });

  (data.errors || []).forEach(e => {
    errors.insertAdjacentHTML("beforeend", `
      <div class="err">
        <strong>${e.shop || e.id}</strong>: ${e.error}
      </div>
    `);
  });
}

document.getElementById("checkBtn").onclick = async function(){
  this.disabled = true;
  this.textContent = "Dang kiem tra...";
  try {
    await fetch("/api/check", { method:"POST" });
    await load();
  } finally {
    this.disabled = false;
    this.textContent = "Kiem tra ngay";
  }
};

load();
setInterval(load, 60000);
</script>
</body>
</html>
