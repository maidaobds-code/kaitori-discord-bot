<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>iPhone Kaitori Full Quote</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --surface: #ffffff;
      --line: #dfe5ee;
      --line-strong: #c8d2df;
      --text: #111827;
      --muted: #64748b;
      --accent: #0f6fc6;
      --best: #fff2c7;
      --profit: #b42318;
      --loss: #075985;
      --stock: #067647;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    .app { padding: 16px; min-width: 1040px; }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; justify-content: space-between; gap: 16px; align-items: center;
      padding: 12px 14px; margin: -16px -16px 12px;
      background: rgba(246, 247, 251, .92); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: 0; }
    .meta { margin-top: 3px; color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; align-items: center; }
    button {
      min-height: 36px; border: 1px solid var(--line-strong); border-radius: 8px;
      padding: 0 12px; background: var(--surface); color: var(--text);
      font-weight: 750; cursor: pointer;
    }
    button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    button:disabled { opacity: .65; cursor: wait; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 8px; margin-bottom: 10px; }
    .stat { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px 12px; }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 750; text-transform: uppercase; }
    .stat-value { margin-top: 2px; font-size: 18px; font-weight: 850; }
    .filters { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px; margin-bottom: 10px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
    label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 650; white-space: nowrap; }
    input { accent-color: var(--accent); }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-height: calc(100vh - 250px); }
    table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 12px; }
    th, td {
      border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
      padding: 6px 8px; white-space: nowrap; background: var(--surface);
      vertical-align: middle; font-variant-numeric: tabular-nums;
    }
    th { position: sticky; top: 0; z-index: 6; background: #eef6ff; color: #17324d; text-align: center; font-weight: 850; }
    th.basic { background: #f1f5f9; }
    th.shop { background: #fff7d6; min-width: 94px; }
    th.store { background: #ecfdf3; min-width: 30px; }
    td.price { text-align: right; min-width: 94px; }
    td.stock { text-align: center; min-width: 30px; }
    td.best { background: var(--best) !important; box-shadow: inset 0 0 0 2px #f2c94c; font-weight: 850; }
    td.profit { text-align: right; font-weight: 850; }
    td.positive { color: var(--profit); }
    td.negative { color: var(--loss); }
    td.stock-ok { background: #ecfdf3; color: var(--stock); font-weight: 850; }
    td.stock-ng { color: #b42318; }
    .sticky-1, .sticky-2, .sticky-3 { position: sticky; z-index: 5; box-shadow: 1px 0 0 var(--line); }
    th.sticky-1, th.sticky-2, th.sticky-3 { z-index: 8; }
    .sticky-1 { left: 0; min-width: 54px; }
    .sticky-2 { left: 54px; min-width: 54px; }
    .sticky-3 { left: 108px; min-width: 96px; }
    .kind-max { background: #ffe8ec; font-weight: 850; }
    .kind-pro { background: #e8f1ff; font-weight: 850; }
    .kind-air { background: #eaf8ef; font-weight: 850; }
    .kind-std { background: #f1f5f9; font-weight: 850; }
    .note { display: block; color: var(--muted); font-size: 11px; min-height: 13px; }
    .hidden { display: none; }
    .error { margin-top: 10px; border: 1px solid #fecdd3; background: #fff1f2; color: #9f1239; border-radius: 8px; padding: 12px; font-weight: 650; }
    @media (max-width: 720px) {
      .app { padding: 10px; min-width: 900px; }
      .topbar { margin: -10px -10px 10px; align-items: flex-start; }
      .summary { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
    }
  </style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div>
      <h1>Bang bao gia day du iPhone Kaitori</h1>
      <div id="updated" class="meta">Dang tai du lieu...</div>
    </div>
    <div class="actions">
      <button id="resetBtn">Reset loc</button>
      <button id="reloadBtn" class="primary">Tai lai</button>
    </div>
  </div>
  <section class="summary" aria-label="Tong quan">
    <div class="stat"><div class="stat-label">San pham</div><div id="rowCount" class="stat-value">0</div></div>
    <div class="stat"><div class="stat-label">Shop bao gia</div><div id="shopCount" class="stat-value">0</div></div>
    <div class="stat"><div class="stat-label">Cot ton kho</div><div id="storeCount" class="stat-value">0</div></div>
    <div class="stat"><div class="stat-label">Lai cao nhat</div><div id="bestProfit" class="stat-value">N/A</div></div>
  </section>
  <section class="filters" aria-label="Bo loc">
    <div class="filter-row" id="kindFilters">
      <label><input id="stockOnly" type="checkbox"> Chi hien may con hang</label>
    </div>
    <div class="filter-row" id="capacityFilters"></div>
    <div class="filter-row" id="colorFilters"></div>
    <div class="filter-row" id="shopFilters"></div>
    <div class="filter-row" id="storeFilters"></div>
  </section>
  <section class="table-wrap" aria-label="Bang bao gia">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </section>
  <div id="errors"></div>
</main>
<script>
const state = { data: null };
const yen = n => n == null ? "N/A" : Number(n).toLocaleString("ja-JP");
const money = n => n == null ? "N/A" : (n > 0 ? "+" : n < 0 ? "-" : "") + yen(Math.abs(n));
const escapeHtml = value => String(value ?? "").replace(/[&<>'"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", "\"":"&quot;" })[c]);

function plainCellHtml(cell) {
  return (cell.html || escapeHtml(cell.text)).replace(/\sstyle="[^"]*"/g, "");
}

function makeCheckboxes(rootId, values, checked = true) {
  const root = document.getElementById(rootId);
  root.innerHTML = "";
  values.forEach(value => {
    root.insertAdjacentHTML("beforeend", `<label><input type="checkbox" value="${escapeHtml(value)}" ${checked ? "checked" : ""}> ${escapeHtml(value)}</label>`);
  });
}

function checkedSet(rootId) {
  return new Set([...document.querySelectorAll(`#${rootId} input[type="checkbox"]:checked`)].map(input => input.value));
}

function columnClass(column, index) {
  const classes = [];
  if (index < 5) classes.push("basic");
  if (index === 0) classes.push("sticky-1");
  if (index === 1) classes.push("sticky-2");
  if (index === 2) classes.push("sticky-3");
  if (column.shop) classes.push("shop");
  if (column.store) classes.push("store");
  return classes.join(" ");
}

function cellClass(cell, index) {
  const classes = [];
  if (index === 0) classes.push("sticky-1");
  if (index === 1) classes.push("sticky-2");
  if (index === 2) classes.push("sticky-3");
  if (index === 4) {
    classes.push("profit");
    if (cell.text.startsWith("+")) classes.push("positive");
    if (cell.text.startsWith("-")) classes.push("negative");
  }
  if (cell.shop) classes.push("price");
  if (cell.store) {
    classes.push("stock");
    if (cell.text && cell.text !== "×") classes.push("stock-ok");
    if (cell.text === "×") classes.push("stock-ng");
  }
  if (cell.isBest) classes.push("best");
  if (index === 0) {
    if (cell.text === "Max") classes.push("kind-max");
    else if (cell.text === "Pro") classes.push("kind-pro");
    else if (cell.text === "Air") classes.push("kind-air");
    else if (cell.text === "Duo") classes.push("kind-std");
    else classes.push("kind-std");
  }
  return classes.join(" ");
}

function renderTable() {
  const data = state.data;
  if (!data) return;
  const kinds = checkedSet("kindFilters");
  const capacities = checkedSet("capacityFilters");
  const colors = checkedSet("colorFilters");
  const shops = checkedSet("shopFilters");
  const stores = checkedSet("storeFilters");
  const stockOnly = document.getElementById("stockOnly").checked;

  const head = document.getElementById("headRow");
  head.innerHTML = "";
  data.columns.forEach((column, index) => {
    const hidden = (column.shop && !shops.has(column.shop)) || (column.store && !stores.has(column.store));
    head.insertAdjacentHTML("beforeend", `<th class="${columnClass(column, index)} ${hidden ? "hidden" : ""}">${column.html || escapeHtml(column.label)}</th>`);
  });

  const body = document.getElementById("bodyRows");
  body.innerHTML = "";
  data.rows.forEach(row => {
    const visibleByBasics = row.isUpdateRow || (kinds.has(row.kind) && capacities.has(row.capacity) && colors.has(row.color));
    const hasStock = row.cells.some(cell => cell.store && stores.has(cell.store) && cell.text && cell.text !== "×");
    if (!visibleByBasics || (stockOnly && !row.isUpdateRow && !hasStock)) return;
    let html = "<tr>";
    row.cells.forEach((cell, index) => {
      const hidden = (cell.shop && !shops.has(cell.shop)) || (cell.store && !stores.has(cell.store));
      html += `<td class="${cellClass(cell, index)} ${hidden ? "hidden" : ""}">${plainCellHtml(cell)}</td>`;
    });
    html += "</tr>";
    body.insertAdjacentHTML("beforeend", html);
  });
}

function setupFilters(data) {
  const products = data.rows.filter(row => !row.isUpdateRow);
  const kindRoot = document.getElementById("kindFilters");
  const stockOnlyChecked = document.getElementById("stockOnly")?.checked || false;
  const kindValues = [...new Set(products.map(row => row.kind).filter(Boolean))];
  kindRoot.innerHTML = `<label><input id="stockOnly" type="checkbox" ${stockOnlyChecked ? "checked" : ""}> Chi hien may con hang</label>`;
  kindValues.forEach(value => {
    kindRoot.insertAdjacentHTML("beforeend", `<label><input type="checkbox" value="${escapeHtml(value)}" checked> ${escapeHtml(value)}</label>`);
  });
  makeCheckboxes("capacityFilters", [...new Set(products.map(row => row.capacity).filter(Boolean))]);
  makeCheckboxes("colorFilters", [...new Set(products.map(row => row.color).filter(Boolean))]);
  makeCheckboxes("shopFilters", data.columns.filter(column => column.shop).map(column => column.shop));
  makeCheckboxes("storeFilters", data.columns.filter(column => column.store).map(column => column.store));
  document.querySelectorAll(".filters input").forEach(input => input.addEventListener("change", renderTable));
}

async function load() {
  const reloadBtn = document.getElementById("reloadBtn");
  reloadBtn.disabled = true;
  try {
    const res = await fetch(`/api/is-checker?_=${Date.now()}`, { cache: "no-store" });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.errors?.[0]?.error || `API returned ${res.status}`);
    state.data = data;
    setupFilters(data);
    document.getElementById("updated").textContent = `Cap nhat luc ${new Date(data.updatedAt).toLocaleString("vi-VN")} tu is-checker`;
    document.getElementById("rowCount").textContent = data.summary.rowCount;
    document.getElementById("shopCount").textContent = data.summary.shopCount;
    document.getElementById("storeCount").textContent = data.summary.storeCount;
    document.getElementById("bestProfit").textContent = money(data.summary.bestProfit);
    document.getElementById("errors").innerHTML = "";
    renderTable();
  } catch (error) {
    document.getElementById("errors").innerHTML = `<div class="error">Khong the lay bang bao gia: ${escapeHtml(error.message)}</div>`;
  } finally {
    reloadBtn.disabled = false;
  }
}

document.getElementById("reloadBtn").addEventListener("click", load);
document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll(".filters input[type='checkbox']").forEach(input => {
    input.checked = input.id !== "stockOnly";
  });
  renderTable();
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
