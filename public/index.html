<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>iPhone 18 Kaitori Compare</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --line: #dbe3ee;
      --line-strong: #c7d2e0;
      --text: #172033;
      --muted: #64748b;
      --primary: #1668dc;
      --primary-dark: #0f4fb0;
      --positive: #087f5b;
      --positive-bg: #e7f7ef;
      --negative: #bd2f3a;
      --negative-bg: #fff0f1;
      --missing: #94a3b8;
      --best: #fff8db;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); }
    .wrap { max-width:1320px; margin:auto; padding:24px 16px 36px; }
    .top {
      display:flex;
      gap:16px;
      justify-content:space-between;
      align-items:flex-end;
      flex-wrap:wrap;
      margin-bottom:18px;
    }
    h1 { margin:0 0 8px; font-size:30px; line-height:1.15; letter-spacing:0; }
    .subline { display:flex; gap:10px; align-items:center; flex-wrap:wrap; color:var(--muted); font-size:14px; }
    .status {
      display:inline-flex;
      align-items:center;
      gap:7px;
      border:1px solid var(--line);
      background:var(--surface);
      border-radius:999px;
      padding:6px 10px;
      color:#334155;
      font-size:13px;
      font-weight:650;
    }
    .dot { width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 4px #dcfce7; }
    .actions { display:flex; gap:10px; align-items:center; }
    button {
      min-height:44px;
      background:var(--primary);
      color:white;
      border:0;
      border-radius:8px;
      padding:0 16px;
      font-weight:750;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(22, 104, 220, 0.18);
    }
    button:hover { background:var(--primary-dark); }
    button:disabled { opacity:.65; cursor:wait; box-shadow:none; }
    .panel {
      border:1px solid var(--line);
      border-radius:10px;
      overflow:hidden;
      background:var(--surface);
      box-shadow:var(--shadow);
    }
    .summary {
      display:grid;
      grid-template-columns:minmax(0, 1fr);
      gap:1px;
      background:var(--line);
      border-bottom:1px solid var(--line);
    }
    .summary-item { background:var(--surface); padding:14px 16px; }
    .summary-label { color:var(--muted); font-size:12px; font-weight:750; text-transform:uppercase; }
    .summary-value { margin-top:4px; font-size:20px; font-weight:850; }
    .scroll { overflow:visible; }
    .mobile-cards { display:none; }
    table { width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; }
    th, td { padding:14px 16px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th {
      z-index:2;
      background:#eef4fb;
      color:#475569;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.02em;
      white-space:nowrap;
      border-bottom:1px solid var(--line-strong);
    }
    td { background:var(--surface); }
    tr:nth-child(even) td { background:var(--surface-soft); }
    tr:hover td { background:#eef6ff; }
    .model { width:18%; }
    .apple { width:13%; }
    .shop-cell { width:23%; }
    .model-name { font-weight:850; font-size:15px; }
    .storage { display:inline-block; margin-top:5px; color:var(--muted); font-size:13px; }
    .price { font-weight:850; white-space:normal; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
    .profit {
      display:inline-flex;
      align-items:center;
      margin-top:7px;
      border-radius:999px;
      padding:4px 9px;
      font-size:13px;
      font-weight:850;
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
    }
    .positive { color:var(--positive); background:var(--positive-bg); }
    .negative { color:var(--negative); background:var(--negative-bg); }
    .missing { color:var(--missing); }
    td.best { background:var(--best) !important; box-shadow:inset 3px 0 0 #f2b705; }
    a { color:var(--primary); text-decoration:none; font-weight:650; }
    a:hover { text-decoration:underline; }
    .link { display:block; margin-top:8px; font-size:12px; }
    .empty, .err { padding:18px; }
    .err { border-top:1px solid #fecdd3; background:#fff1f2; color:#9f1239; }
    code { background:#e2e8f0; padding:2px 6px; border-radius:6px; }
    .product-card { border-top:1px solid var(--line); background:var(--surface); }
    .product-card-head { padding:14px 16px; background:#eef4fb; }
    .product-card-title { font-size:16px; font-weight:850; }
    .product-card-apple { margin-top:8px; color:var(--muted); font-size:13px; }
    .shop-list { display:grid; gap:10px; padding:12px; }
    .shop-card {
      border:1px solid var(--line);
      border-radius:8px;
      padding:12px;
      background:var(--surface);
    }
    .shop-card.best { border-color:#f2b705; background:var(--best); }
    .shop-card-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .shop-name { font-weight:800; overflow-wrap:anywhere; }
    .shop-card .price { text-align:right; }

    @media (max-width: 720px) {
      .wrap { padding:18px 10px 26px; }
      h1 { font-size:24px; }
      .top { align-items:stretch; }
      .actions, button { width:100%; }
      .summary { grid-template-columns:1fr; }
      .scroll { display:none; }
      .mobile-cards { display:block; }
    }
  </style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <h1>iPhone 18 Kaitori Compare</h1>
      <div class="subline">
        <span id="updated">Dang tai...</span>
        <span class="status"><span class="dot" aria-hidden="true"></span>Tu dong cap nhat moi 1 phut</span>
      </div>
    </div>
    <div class="actions">
      <button id="checkBtn">Kiem tra ngay</button>
    </div>
  </div>

  <section class="panel" aria-label="Bang so sanh gia thu mua iPhone 18">
    <div class="summary">
      <div class="summary-item">
        <div class="summary-label">Lai tot nhat</div>
        <div id="bestProfit" class="summary-value">N/A</div>
      </div>
    </div>

    <div class="scroll">
      <table>
        <thead>
          <tr id="headRow">
            <th class="model">Model</th>
            <th class="apple">Gia Apple</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="mobileCards" class="mobile-cards"></div>
    <div id="empty" class="empty missing" style="display:none"></div>
    <div id="errors"></div>
  </section>
</main>

<script>
function escapeHtml(value){
  return String(value ?? "").replace(/[&<>'"]/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "'": "&#39;",
    "\"": "&quot;"
  })[char]);
}

const allowedLinkHosts = new Set([
  "www.apple.com",
  "www.kaitorishouten-co.jp",
  "pastec.net",
  "www.1-chome.com"
]);

function safeHref(value){
  try {
    const url = new URL(String(value ?? ""), window.location.origin);
    return ["http:", "https:"].includes(url.protocol) && allowedLinkHosts.has(url.hostname)
      ? escapeHtml(url.href)
      : "#";
  } catch {
    return "#";
  }
}

function yen(n){
  return n == null ? "N/A" : "\u00a5" + Number(n).toLocaleString("ja-JP");
}

function profitText(n){
  if (n == null) return "Lai: N/A";
  return (n >= 0 ? "Lai +" : "Lo ") + yen(n);
}

function profitClass(n){
  if (n == null) return "missing";
  return n >= 0 ? "positive" : "negative";
}

function productRankValue(product){
  return Math.max(...product.offers.map(x => x.profit ?? -Infinity));
}

function groupRows(rows){
  const products = new Map();
  const shops = new Map();

  rows.forEach(row => {
    if (!products.has(row.key)) {
      products.set(row.key, {
        key: row.key,
        model: row.model,
        storage: row.storage,
        applePrice: row.applePrice,
        appleUrl: row.appleUrl,
        checkedAt: row.checkedAt,
        offers: []
      });
    }

    const product = products.get(row.key);
    product.applePrice = product.applePrice ?? row.applePrice;
    product.appleUrl = product.appleUrl || row.appleUrl;
    product.checkedAt = row.checkedAt || product.checkedAt;
    product.offers.push(row);

    if (!shops.has(row.shop)) {
      shops.set(row.shop, { name: row.shop });
    }
  });

  return {
    shops: [...shops.values()].sort((a, b) => a.name.localeCompare(b.name)),
    products: [...products.values()].sort((a, b) => productRankValue(b) - productRankValue(a))
  };
}

function updateSummary(shops, products){
  const best = products.length ? Math.max(...products.map(productRankValue)) : null;
  document.getElementById("bestProfit").textContent = best == null || best === -Infinity ? "N/A" : yen(best);
  document.getElementById("bestProfit").className = "summary-value " + profitClass(best);
}

async function load(){
  const res = await fetch("/api/prices", { cache: "no-store" });
  const data = await res.json();
  const rawRows = data.rows || [];
  const { shops, products } = groupRows(rawRows);

  document.getElementById("updated").textContent =
    data.updatedAt ? "Cập nhật giá lần cuối: " + new Date(data.updatedAt).toLocaleString("vi-VN")
                   : "Chua co du lieu. Bam kiem tra ngay.";

  updateSummary(shops, products);

  const head = document.getElementById("headRow");
  const body = document.getElementById("rows");
  const mobileCards = document.getElementById("mobileCards");
  const empty = document.getElementById("empty");
  const errors = document.getElementById("errors");

  head.innerHTML = `<th class="model">Model</th><th class="apple">Gia Apple</th>`;
  shops.forEach(shop => {
    head.insertAdjacentHTML("beforeend", `<th class="shop-cell">${escapeHtml(shop.name)}</th>`);
  });

  body.innerHTML = "";
  mobileCards.innerHTML = "";
  errors.innerHTML = "";
  empty.style.display = products.length ? "none" : "block";
  empty.innerHTML = products.length ? "" : "Chua tim thay gia iPhone 18. Kiem tra <code>sources.json</code> hoac website nguon.";

  products.forEach(product => {
    const bestProfit = productRankValue(product);
    let html = `
      <tr>
        <td class="model">
          <div class="model-name">${escapeHtml(product.model)}</div>
          <span class="storage">${escapeHtml(product.storage)}</span>
        </td>
        <td class="apple">
          <div class="price">${yen(product.applePrice)}</div>
          ${product.appleUrl ? `<a class="link" href="${safeHref(product.appleUrl)}" target="_blank" rel="noopener noreferrer">Apple</a>` : ""}
        </td>
    `;

    shops.forEach(shop => {
      const offer = product.offers.find(x => x.shop === shop.name);
      if (!offer) {
        html += `<td class="shop-cell missing">Chua co gia</td>`;
        return;
      }

      const isBest = offer.profit != null && offer.profit === bestProfit;
      html += `
        <td class="shop-cell ${isBest ? "best" : ""}">
          <div class="price">${yen(offer.buyPrice)}</div>
          <div class="profit ${profitClass(offer.profit)}">${profitText(offer.profit)}</div>
          <a class="link" href="${safeHref(offer.url)}" target="_blank" rel="noopener noreferrer">Mo trang</a>
        </td>
      `;
    });

    html += `</tr>`;
    body.insertAdjacentHTML("beforeend", html);

    let cardHtml = `
      <article class="product-card">
        <div class="product-card-head">
          <div class="product-card-title">${escapeHtml(product.model)} ${escapeHtml(product.storage)}</div>
          <div class="product-card-apple">Gia Apple: <strong>${yen(product.applePrice)}</strong></div>
        </div>
        <div class="shop-list">
    `;

    shops.forEach(shop => {
      const offer = product.offers.find(x => x.shop === shop.name);
      if (!offer) {
        cardHtml += `
          <div class="shop-card missing">
            <div class="shop-name">${escapeHtml(shop.name)}</div>
            <div style="margin-top:8px">Chua co gia</div>
          </div>
        `;
        return;
      }

      const isBest = offer.profit != null && offer.profit === bestProfit;
      cardHtml += `
        <div class="shop-card ${isBest ? "best" : ""}">
          <div class="shop-card-top">
            <div class="shop-name">${escapeHtml(offer.shop)}</div>
            <div class="price">${yen(offer.buyPrice)}</div>
          </div>
          <div class="profit ${profitClass(offer.profit)}">${profitText(offer.profit)}</div>
          <a class="link" href="${safeHref(offer.url)}" target="_blank" rel="noopener noreferrer">Mo trang</a>
        </div>
      `;
    });

    cardHtml += `
        </div>
      </article>
    `;
    mobileCards.insertAdjacentHTML("beforeend", cardHtml);
  });

  (data.errors || []).forEach(e => {
    errors.insertAdjacentHTML("beforeend", `
      <div class="err">
        <strong>${escapeHtml(e.shop || e.id)}</strong>: ${escapeHtml(e.error)}
      </div>
    `);
  });
}

document.getElementById("checkBtn").onclick = async function(){
  this.disabled = true;
  this.textContent = "Dang kiem tra...";
  try {
    await fetch("/api/check", { method:"POST", cache: "no-store" });
    await load();
  } finally {
    this.disabled = false;
    this.textContent = "Kiem tra ngay";
  }
};

load();
setInterval(load, 30000);
</script>
</body>
</html>
