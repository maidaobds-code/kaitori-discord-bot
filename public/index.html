<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>iPhone Kaitori Full Quote</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7f6;
      --surface: #ffffff;
      --surface-soft: #f8fbfb;
      --line: #d8e4e2;
      --line-strong: #b8c9c6;
      --text: #10201d;
      --muted: #5f746f;
      --accent: #0f766e;
      --accent-strong: #155e75;
      --best: #fff7cc;
      --profit: #047857;
      --loss: #b42318;
      --stock: #047857;
      --profit-bg: #dcfce7;
      --loss-bg: #fee4e2;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    .app { padding: 16px; min-width: 1040px; }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; justify-content: space-between; gap: 16px; align-items: center;
      padding: 12px 14px; margin: -16px -16px 12px;
      background: rgba(244, 247, 246, .94); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: 0; }
    .meta { margin-top: 3px; color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; align-items: center; }
    button {
      min-height: 36px; border: 1px solid var(--line-strong); border-radius: 8px;
      padding: 0 12px; background: var(--surface); color: var(--text);
      font-weight: 750; cursor: pointer;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 0 12px;
      background: var(--surface);
      color: var(--text);
      font-weight: 750;
      text-decoration: none;
    }
    button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    button.active { border-color: var(--accent); background: #dff7ef; color: #064e3b; }
    button:disabled { opacity: .65; cursor: wait; }
    .summary { display: grid; grid-template-columns: minmax(150px, 260px); gap: 8px; margin-bottom: 10px; }
    .stat { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px 12px; }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 750; text-transform: uppercase; }
    .stat-value { margin-top: 2px; font-size: 18px; font-weight: 850; }
    .filters { display: grid; gap: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px; margin-bottom: 10px; }
    .filters.collapsed { display: none; }
    .filter-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 2px 2px 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
    }
    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 10px;
      background: var(--surface-soft);
      color: #36514b;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    label:hover { border-color: #81aaa3; background: #edf8f6; }
    label:has(input:checked) { border-color: var(--accent); background: #dff7ef; color: #064e3b; }
    label input { position: absolute; opacity: 0; pointer-events: none; }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-height: calc(100vh - 250px); }
    table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 12px; }
    th, td {
      border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
      padding: 6px 8px; white-space: nowrap; background: var(--surface);
      vertical-align: middle; font-variant-numeric: tabular-nums;
    }
    th { position: sticky; top: 0; z-index: 6; background: #e6f3f1; color: #123b35; text-align: center; font-weight: 850; }
    th.basic { background: #edf4f3; }
    th.shop { background: #fff3d8; min-width: 112px; color: #5f3b05; }
    th.store { background: #e0f2fe; min-width: 30px; color: #075985; }
    th.capacity, td.capacity { text-align: center; font-weight: 850; }
    th.color, td.color { width: 76px; min-width: 76px; max-width: 76px; text-align: center; padding-left: 6px; padding-right: 6px; }
    td.price { text-align: right; min-width: 112px; padding: 6px; }
    td.stock { text-align: center; min-width: 30px; }
    td.best { background: var(--best) !important; box-shadow: inset 0 0 0 2px #f2c94c; }
    td.profit { text-align: right; font-weight: 850; }
    td.positive { color: var(--profit); }
    td.negative { color: var(--loss); }
    .quote-cell { display: grid; gap: 3px; justify-items: end; line-height: 1.15; }
    .quote-price { color: #0f172a; font-size: 13px; font-weight: 850; }
    .quote-profit {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 72px;
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 850;
    }
    .quote-profit.positive { background: var(--profit-bg); color: var(--profit); }
    .quote-profit.negative { background: var(--loss-bg); color: var(--loss); }
    .quote-profit.zero { background: #eef2f2; color: #4b635d; }
    .quote-delta { color: var(--muted); font-size: 10px; font-weight: 650; }
    .quote-updated {
      display: inline-flex;
      align-items: center;
      color: #9a3412;
      font-size: 10px;
      font-weight: 800;
    }
    .quote-empty { color: #94a3b8; font-weight: 750; }
    td.price.change-new { box-shadow: inset 0 0 0 3px #f97316; background: #fff4e6; }
    td.price.change-warm { box-shadow: inset 0 0 0 2px #fb923c; background: #fff7ed; }
    td.price.change-soft { box-shadow: inset 0 0 0 1px #fdba74; background: #fffaf4; }
    td.stock-ok { background: #dcfce7; color: var(--stock); font-weight: 850; }
    td.stock-ng { color: #b42318; }
    .sticky-1, .sticky-2, .sticky-3 { position: sticky; z-index: 5; box-shadow: 1px 0 0 var(--line); }
    th.sticky-1, th.sticky-2, th.sticky-3 { z-index: 8; }
    .sticky-1 { left: 0; min-width: 54px; }
    .sticky-2 { left: 54px; min-width: 54px; }
    .sticky-3 { left: 108px; min-width: 96px; }
    .sticky-3.color {
      width: 76px;
      min-width: 76px;
      max-width: 76px;
      background: #fef3c7 !important;
      color: #7c2d12;
      font-weight: 950;
      box-shadow: inset 0 0 0 2px #f59e0b, 1px 0 0 var(--line);
    }
    .kind-max { background: #fee2e2; font-weight: 850; }
    .kind-pro { background: #dbeafe; font-weight: 850; }
    .kind-air { background: #dcfce7; font-weight: 850; }
    .kind-std { background: #eef2f2; font-weight: 850; }
    .cap-256 { background: #ecfeff !important; color: #155e75; }
    .cap-512 { background: #eef2ff !important; color: #3730a3; }
    .cap-1tb { background: #fef3c7 !important; color: #92400e; }
    .cap-2tb { background: #fae8ff !important; color: #86198f; }
    .note { display: block; color: var(--muted); font-size: 11px; min-height: 13px; }
    .mobile-controls, .mobile-cards { display: none; }
    .search-input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 0 12px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-weight: 650;
    }
    .mobile-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }
    .mobile-card-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      background: #f8fbfb;
      border-bottom: 1px solid var(--line);
    }
    .mobile-title { display: grid; gap: 2px; min-width: 0; }
    .mobile-name { font-size: 15px; font-weight: 850; }
    .mobile-sub {
      display: inline-flex;
      width: fit-content;
      border: 1px solid #f59e0b;
      border-radius: 999px;
      padding: 2px 8px;
      background: #fef3c7;
      color: #7c2d12;
      font-size: 12px;
      font-weight: 900;
    }
    .mobile-profit { text-align: right; font-size: 16px; font-weight: 900; white-space: nowrap; }
    .mobile-retail { color: var(--muted); font-size: 11px; font-weight: 700; text-align: right; }
    .mobile-offers { display: grid; gap: 6px; padding: 8px; }
    .mobile-offer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: #fff;
    }
    .mobile-offer.change-new { box-shadow: inset 0 0 0 3px #f97316; background: #fff4e6; }
    .mobile-offer.change-warm { box-shadow: inset 0 0 0 2px #fb923c; background: #fff7ed; }
    .mobile-offer.change-soft { box-shadow: inset 0 0 0 1px #fdba74; background: #fffaf4; }
    .mobile-shop { font-weight: 850; }
    .mobile-price-wrap { display: grid; gap: 3px; justify-items: end; }
    .mobile-price { text-align: right; font-size: 14px; font-weight: 900; }
    .mobile-stock {
      padding: 0 8px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }
    .mobile-more { padding: 0 8px 8px; }
    .mobile-more summary {
      min-height: 34px;
      display: flex;
      align-items: center;
      color: var(--accent);
      font-weight: 850;
      cursor: pointer;
    }
    .mobile-empty {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 14px;
      color: var(--muted);
      font-weight: 750;
    }
    .hidden { display: none; }
    .error { margin-top: 10px; border: 1px solid #fecdd3; background: #fff1f2; color: #9f1239; border-radius: 8px; padding: 12px; font-weight: 650; }
    @media (max-width: 720px) {
      .app { padding: 10px; min-width: 0; }
      .topbar { margin: -10px -10px 10px; align-items: flex-start; position: static; flex-direction: column; }
      .actions { width: 100%; overflow-x: auto; padding-bottom: 2px; }
      .actions button, .actions .button { flex: 0 0 auto; }
      .summary { grid-template-columns: minmax(0, 1fr); }
      .filters { position: sticky; top: 0; z-index: 12; max-height: 52vh; overflow: auto; }
      .filter-row { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
      .filter-row label { flex: 0 0 auto; min-height: 34px; }
      .table-wrap { display: none; }
      .mobile-controls { display: grid; gap: 8px; margin-bottom: 10px; }
      .mobile-cards { display: grid; gap: 10px; }
    }
  </style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div>
      <h1>Bảng báo giá thu mua iPhone</h1>
      <div id="updated" class="meta">Đang tải dữ liệu...</div>
    </div>
    <div class="actions">
      <a class="button" href="/apple-stock/">Tồn kho Apple</a>
      <button id="filterBtn">Mở bộ lọc</button>
      <button id="sortBtn" class="active">Lãi cao đến thấp</button>
      <button id="nameSortBtn">Tên sản phẩm</button>
      <button id="reloadBtn" class="primary">Tải lại</button>
    </div>
  </div>
  <section class="summary" aria-label="Tổng quan">
    <div class="stat"><div class="stat-label">Lãi cao nhất</div><div id="bestProfit" class="stat-value">N/A</div></div>
  </section>
  <section id="filterPanel" class="filters collapsed" aria-label="Bộ lọc">
    <div class="filter-title">
      <span>Bộ lọc hiển thị</span>
      <span id="filterSummary">Tất cả đang hiển thị</span>
    </div>
    <div class="filter-row" id="kindFilters">
      <label><input id="stockOnly" type="checkbox"> Chỉ hiện máy còn hàng</label>
    </div>
    <div class="filter-row" id="capacityFilters"></div>
    <div class="filter-row" id="colorFilters"></div>
    <div class="filter-row" id="shopFilters"></div>
  </section>
  <section class="mobile-controls" aria-label="Tim nhanh">
    <input id="quickSearch" class="search-input" type="search" placeholder="Tìm nhanh: pro 512 đen" autocomplete="off">
  </section>
  <section class="table-wrap" aria-label="Bảng báo giá">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </section>
  <section id="mobileCards" class="mobile-cards" aria-label="Danh sách sản phẩm"></section>
  <div id="errors"></div>
</main>
<script src="/shared.js"></script>
<script>
const CHANGE_WARM_MS = 30 * 60 * 1000;
const CHANGE_SOFT_MS = 90 * 60 * 1000;
const CHANGE_TTL_MS = 3 * 60 * 60 * 1000;
const state = {
  data: null,
  sortMode: "profit",
  priceChanges: {}
};
const yen = n => n == null ? "N/A" : Number(n).toLocaleString("ja-JP");
const money = n => n == null ? "N/A" : (n > 0 ? "+" : n < 0 ? "-" : "") + yen(Math.abs(n));
const profitLabel = n => n == null ? "" : money(n);

function displayCellText(cell, index) {
  if (index === 0 || index === 2) return translateVi(cell.text);
  return cell.text;
}

function removeLegacyResetButton() {
  document.querySelectorAll("button").forEach(button => {
    if (button.id === "resetBtn" || button.textContent.trim().toLowerCase() === "reset loc") {
      button.remove();
    }
  });
}

function plainCellHtml(cell, index) {
  return escapeHtml(displayCellText(cell, index));
}

function parseDelta(value) {
  const match = String(value ?? "").replace(/,/g, "").match(/\(([+-]\d+)\)/);
  return match ? Number(match[1]) : null;
}

function profitClass(value) {
  if (value > 0) return "positive";
  if (value < 0) return "negative";
  return "zero";
}

function renderShopCell(cell, row) {
  const buyPrice = parseNumber(cell.text);
  if (buyPrice == null) return `<span class="quote-empty">-</span>`;

  const retail = Number(row.teikaOld) || parseNumber(row.cells[3]?.text);
  const profit = retail ? buyPrice - retail : null;
  const delta = parseDelta(cell.text);

  return `
    <div class="quote-cell">
      <div class="quote-price">${yen(buyPrice)}</div>
      ${profit == null ? "" : `<div class="quote-profit ${profitClass(profit)}">${profitLabel(profit)}</div>`}
      ${delta == null ? "" : `<div class="quote-delta">Biến động ${money(delta)}</div>`}
      ${renderChangeTime(row, cell)}
    </div>
  `;
}

function bestRowProfit(row) {
  const retail = Number(row.teikaOld) || parseNumber(row.cells[3]?.text);
  if (!retail) return null;
  const profits = row.cells
    .filter(cell => cell.shop)
    .map(cell => {
      const price = parseNumber(cell.text);
      return price == null ? null : price - retail;
    })
    .filter(value => value != null);
  return profits.length ? Math.max(...profits) : null;
}

function productName(row) {
  return [row.kind, row.capacity, translateVi(row.color)].filter(Boolean).join(" ");
}

function priceKey(row, cell) {
  return [row.kind, row.capacity, row.color, cell.shop].map(value => String(value || "").trim()).join("|");
}

function priceChangeClass(row, cell) {
  if (!cell.shop) return "";
  const changedAt = state.priceChanges[priceKey(row, cell)];
  if (!changedAt) return "";
  const age = Date.now() - changedAt;
  if (age < CHANGE_WARM_MS) return "change-new";
  if (age < CHANGE_SOFT_MS) return "change-warm";
  if (age < CHANGE_TTL_MS) return "change-soft";
  return "";
}

function priceChangedAt(row, cell) {
  if (!cell.shop) return null;
  const changedAt = Number(state.priceChanges[priceKey(row, cell)]);
  return Number.isFinite(changedAt) && changedAt > 0 ? changedAt : null;
}

function formatChangeTime(timestamp) {
  const date = new Date(timestamp);
  if (Number.isNaN(date.getTime())) return "";
  return date.toLocaleString("vi-VN", {
    day: "2-digit",
    month: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function renderChangeTime(row, cell) {
  const changedAt = priceChangedAt(row, cell);
  if (!changedAt) return "";
  return `<div class="quote-updated">Đổi lúc ${escapeHtml(formatChangeTime(changedAt))}</div>`;
}

function rowHasStock(row, stores) {
  return row.cells.some(cell => cell.store && stores.has(cell.store) && cell.text && cell.text !== "\u00d7");
}

function rowMatchesSearch(row) {
  const input = document.getElementById("quickSearch");
  const query = String(input?.value || "").trim().toLowerCase();
  if (!query) return true;
  const haystack = [
    row.kind,
    row.capacity,
    row.color,
    translateVi(row.color),
    ...row.cells.filter(cell => cell.shop).map(cell => cell.shop)
  ].join(" ").toLowerCase();
  return query.split(/\s+/).every(part => haystack.includes(part));
}

function filteredProductRows(data) {
  const kinds = checkedSet("kindFilters");
  const capacities = checkedSet("capacityFilters");
  const colors = checkedSet("colorFilters");
  const stores = new Set(data.columns.filter(column => column.store).map(column => column.store));
  const stockOnly = document.getElementById("stockOnly").checked;
  return sortProductRows(data.rows.filter(row => {
    if (row.isUpdateRow) return false;
    if (!kinds.has(row.kind) || !capacities.has(row.capacity) || !colors.has(row.color)) return false;
    if (stockOnly && !rowHasStock(row, stores)) return false;
    return rowMatchesSearch(row);
  }));
}

function sortProductRows(rows) {
  const productRows = [...rows];
  if (state.sortMode === "name") {
    return productRows.sort((a, b) => productName(a).localeCompare(productName(b), "ja"));
  }
  return productRows.sort((a, b) => {
    const profitDiff = (bestRowProfit(b) ?? -Infinity) - (bestRowProfit(a) ?? -Infinity);
    return profitDiff || productName(a).localeCompare(productName(b), "ja");
  });
}

function setSortMode(mode) {
  state.sortMode = mode;
  document.getElementById("sortBtn").classList.toggle("active", mode === "profit");
  document.getElementById("nameSortBtn").classList.toggle("active", mode === "name");
  renderTable();
}

function shopOffers(row, shops) {
  const retail = Number(row.teikaOld) || parseNumber(row.cells[3]?.text);
  return row.cells
    .filter(cell => cell.shop && shops.has(cell.shop))
    .map(cell => {
      const price = parseNumber(cell.text);
      return price == null ? null : {
        cell,
        price,
        profit: retail ? price - retail : null
      };
    })
    .filter(Boolean)
    .sort((a, b) => b.price - a.price);
}

function stockLocations(row) {
  const locations = row.cells
    .filter(cell => cell.store && cell.text && cell.text !== "\u00d7")
    .map(cell => {
      const column = state.data?.columns?.find(item => item.store === cell.store);
      return column?.label || cell.store || cell.text;
    })
    .filter(Boolean);
  return locations.length ? locations.join(", ") : "Chưa thấy cửa hàng Apple còn hàng";
}

function renderOffer(row, offer) {
  const column = state.data?.columns?.find(item => item.shop === offer.cell.shop);
  const shopName = column?.label || offer.cell.shop;
  return `
    <div class="mobile-offer ${priceChangeClass(row, offer.cell)}">
      <div>
        <div class="mobile-shop">${escapeHtml(shopName)}</div>
        ${offer.profit == null ? "" : `<div class="quote-profit ${profitClass(offer.profit)}">${profitLabel(offer.profit)}</div>`}
      </div>
      <div class="mobile-price-wrap">
        <div class="mobile-price">${yen(offer.price)}</div>
        ${renderChangeTime(row, offer.cell)}
      </div>
    </div>
  `;
}

function renderMobileCards(rows, shops) {
  const mount = document.getElementById("mobileCards");
  if (!mount) return;
  if (!rows.length) {
    mount.innerHTML = `<div class="mobile-empty">Không có sản phẩm phù hợp.</div>`;
    return;
  }

  mount.innerHTML = rows.map(row => {
    const offers = shopOffers(row, shops);
    const topOffers = offers.slice(0, 5);
    const moreOffers = offers.slice(5);
    const best = offers[0];
    const retail = Number(row.teikaOld) || parseNumber(row.cells[3]?.text);
    return `
      <article class="mobile-card">
        <div class="mobile-card-head">
          <div class="mobile-title">
            <div class="mobile-name">${escapeHtml(translateVi(row.kind))} ${escapeHtml(row.capacity)}</div>
            <div class="mobile-sub">${escapeHtml(translateVi(row.color))}</div>
          </div>
          <div>
            <div class="mobile-profit ${profitClass(best?.profit)}">${best?.profit == null ? "N/A" : profitLabel(best.profit)}</div>
            <div class="mobile-retail">Giá niêm yết ${yen(retail)}</div>
          </div>
        </div>
        <div class="mobile-offers">
          ${topOffers.map(offer => renderOffer(row, offer)).join("") || `<div class="mobile-empty">Chưa có giá shop.</div>`}
        </div>
        <div class="mobile-stock">Apple còn hàng: ${escapeHtml(stockLocations(row))}</div>
        ${moreOffers.length ? `
          <details class="mobile-more">
            <summary>Xem thêm ${moreOffers.length} shop</summary>
            <div class="mobile-offers">${moreOffers.map(offer => renderOffer(row, offer)).join("")}</div>
          </details>
        ` : ""}
      </article>
    `;
  }).join("");
}

function renderRowProfitCell(row) {
  const profit = bestRowProfit(row);
  if (profit == null) return plainCellHtml(row.cells[4] || {}, 4);
  return `<span class="${profitClass(profit)}">${profitLabel(profit)}</span>`;
}

function makeCheckboxes(rootId, values, checked = true, labelFor = value => value) {
  const root = document.getElementById(rootId);
  root.innerHTML = "";
  values.forEach(value => {
    root.insertAdjacentHTML("beforeend", `<label><input type="checkbox" value="${escapeHtml(value)}" ${checked ? "checked" : ""}> ${escapeHtml(labelFor(value))}</label>`);
  });
}

function updateFilterSummary() {
  const summary = document.getElementById("filterSummary");
  if (!summary) return;
  const total = document.querySelectorAll("#filterPanel input[type='checkbox']").length;
  const checked = document.querySelectorAll("#filterPanel input[type='checkbox']:checked").length;
  summary.textContent = `${checked}/${total} đang bật`;
}

function capacityClass(value) {
  const text = String(value || "").toLowerCase();
  if (text.includes("256")) return "cap-256";
  if (text.includes("512")) return "cap-512";
  if (text.includes("1tb")) return "cap-1tb";
  if (text.includes("2tb")) return "cap-2tb";
  return "";
}

function columnClass(column, index) {
  const classes = [];
  if (index < 5) classes.push("basic");
  if (index === 0) classes.push("sticky-1");
  if (index === 1) classes.push("sticky-2", "capacity");
  if (index === 2) classes.push("sticky-3", "color");
  if (column.shop) classes.push("shop");
  if (column.store) classes.push("store");
  return classes.join(" ");
}

function cellClass(cell, index) {
  const classes = [];
  if (index === 0) classes.push("sticky-1");
  if (index === 1) classes.push("sticky-2", "capacity", capacityClass(cell.text));
  if (index === 2) classes.push("sticky-3", "color");
  if (index === 4) {
    classes.push("profit");
    if (cell.text.startsWith("+")) classes.push("positive");
    if (cell.text.startsWith("-")) classes.push("negative");
  }
  if (cell.shop) classes.push("price");
  if (cell.store) {
    classes.push("stock");
    if (cell.text && cell.text !== "\u00d7") classes.push("stock-ok");
    if (cell.text === "\u00d7") classes.push("stock-ng");
  }
  if (cell.isBest) classes.push("best");
  if (index === 0) {
    if (cell.text === "Max") classes.push("kind-max");
    else if (cell.text === "Pro") classes.push("kind-pro");
    else if (cell.text === "Air") classes.push("kind-air");
    else if (cell.text === "Duo") classes.push("kind-std");
    else classes.push("kind-std");
  }
  return classes.join(" ");
}

function renderTable() {
  const data = state.data;
  if (!data) return;
  const shops = checkedSet("shopFilters");
  updateFilterSummary();

  const head = document.getElementById("headRow");
  head.innerHTML = "";
  data.columns.forEach((column, index) => {
    const hidden = (column.shop && !shops.has(column.shop)) || Boolean(column.store);
    head.insertAdjacentHTML("beforeend", `<th class="${columnClass(column, index)} ${hidden ? "hidden" : ""}">${escapeHtml(displayColumnLabel(column))}</th>`);
  });

  const body = document.getElementById("bodyRows");
  body.innerHTML = "";
  const updateRows = data.rows.filter(row => row.isUpdateRow);
  const productRows = filteredProductRows(data);
  const rows = [...updateRows, ...productRows];
  renderMobileCards(productRows, shops);

  rows.forEach(row => {
    let html = "<tr>";
    row.cells.forEach((cell, index) => {
      const hidden = (cell.shop && !shops.has(cell.shop)) || Boolean(cell.store);
      const content = cell.shop ? renderShopCell(cell, row)
        : (!row.isUpdateRow && index === 4 ? renderRowProfitCell(row) : plainCellHtml(cell, index));
      html += `<td class="${cellClass(cell, index)} ${priceChangeClass(row, cell)} ${hidden ? "hidden" : ""}">${content}</td>`;
    });
    html += "</tr>";
    body.insertAdjacentHTML("beforeend", html);
  });
}

function setupFilters(data) {
  const products = data.rows.filter(row => !row.isUpdateRow);
  const kindRoot = document.getElementById("kindFilters");
  const stockOnlyChecked = document.getElementById("stockOnly")?.checked || false;
  const kindValues = [...new Set(products.map(row => row.kind).filter(Boolean))];
  kindRoot.innerHTML = `<label><input id="stockOnly" type="checkbox" ${stockOnlyChecked ? "checked" : ""}> Chỉ hiện máy còn hàng</label>`;
  kindValues.forEach(value => {
    kindRoot.insertAdjacentHTML("beforeend", `<label><input type="checkbox" value="${escapeHtml(value)}" checked> ${escapeHtml(translateVi(value))}</label>`);
  });
  makeCheckboxes("capacityFilters", [...new Set(products.map(row => row.capacity).filter(Boolean))]);
  makeCheckboxes("colorFilters", [...new Set(products.map(row => row.color).filter(Boolean))], true, translateVi);
  makeCheckboxes("shopFilters", data.columns.filter(column => column.shop).map(column => column.shop), true, value => {
    const column = data.columns.find(item => item.shop === value);
    return column?.label || value;
  });
  document.querySelectorAll(".filters input").forEach(input => input.addEventListener("change", renderTable));
  updateFilterSummary();
}

async function load(options = {}) {
  const reloadBtn = document.getElementById("reloadBtn");
  reloadBtn.disabled = true;
  try {
    const data = await fetchIsChecker(options);
    state.data = data;
    state.priceChanges = data.priceChanges || {};
    setupFilters(data);
    document.getElementById("updated").textContent = `Cập nhật lúc ${new Date(data.updatedAt).toLocaleString("vi-VN")} từ is-checker`;
    document.getElementById("bestProfit").textContent = money(data.summary.bestProfit);
    document.getElementById("errors").innerHTML = "";
    renderTable();
  } catch (error) {
    document.getElementById("errors").innerHTML = `<div class="error">Không thể lấy bảng báo giá: ${escapeHtml(error.message)}</div>`;
  } finally {
    reloadBtn.disabled = false;
  }
}

document.getElementById("reloadBtn").addEventListener("click", () => load({ force: true }));
document.getElementById("filterBtn").addEventListener("click", () => {
  const panel = document.getElementById("filterPanel");
  const button = document.getElementById("filterBtn");
  const collapsed = panel.classList.toggle("collapsed");
  button.classList.toggle("active", !collapsed);
  button.textContent = collapsed ? "Mở bộ lọc" : "Bộ lọc";
});
document.getElementById("sortBtn").addEventListener("click", () => {
  setSortMode("profit");
});
document.getElementById("nameSortBtn").addEventListener("click", () => {
  setSortMode("name");
});
document.getElementById("quickSearch").addEventListener("input", renderTable);

removeLegacyResetButton();
load();
setInterval(load, 60000);
</script>
</body>
</html>
