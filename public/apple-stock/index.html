<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tồn kho Apple</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7f6;
      --surface: #ffffff;
      --line: #d8e4e2;
      --text: #10201d;
      --muted: #5f746f;
      --accent: #0f766e;
      --stock: #047857;
      --stock-bg: #dcfce7;
      --none: #b42318;
      --none-bg: #fee4e2;
      --warn: #a15c07;
      --warn-bg: #fff7d6;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    .app { max-width: 1440px; margin: 0 auto; padding: 16px; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 12px 0;
      background: rgba(244, 247, 246, .94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: 0; }
    .meta { margin-top: 3px; color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; align-items: center; }
    a.button, button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      border: 1px solid #b8c9c6;
      border-radius: 8px;
      padding: 0 12px;
      background: var(--surface);
      color: var(--text);
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
    }
    button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .panel {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: #f8fbfb;
    }
    .stat {
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: var(--surface);
    }
    .stat-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }
    .stat-value {
      margin-top: 2px;
      color: var(--text);
      font-size: 18px;
      line-height: 1.2;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }
    label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 10px;
      background: #f8fbfb;
      color: #36514b;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    label:has(input:checked) { border-color: var(--accent); background: #dff7ef; color: #064e3b; }
    label input { position: absolute; opacity: 0; pointer-events: none; }
    .stock-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
    th, td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 8px; vertical-align: middle; }
    th { position: sticky; top: 61px; z-index: 2; background: #e6f3f1; color: #123b35; text-align: center; font-weight: 850; }
    th:first-child, td:first-child { position: sticky; left: 0; z-index: 3; background: var(--surface); min-width: 220px; }
    th:first-child { z-index: 4; background: #e6f3f1; text-align: left; }
    .product { display: grid; gap: 2px; }
    .product-name { font-weight: 850; }
    .product-sub { color: var(--muted); font-size: 11px; }
    .stock-cell { text-align: center; font-weight: 850; min-width: 76px; }
    .has-stock { background: var(--stock-bg); color: var(--stock); }
    .no-stock { background: var(--none-bg); color: var(--none); }
    .unknown { background: #eef2f2; color: #5f746f; }
    .changed { box-shadow: inset 0 0 0 2px var(--warn); background: var(--warn-bg); }
    .mobile-list { display: none; }
    .stock-card {
      border-bottom: 1px solid var(--line);
      padding: 12px;
      background: var(--surface);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .card-title {
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .card-name {
      font-size: 15px;
      line-height: 1.25;
      font-weight: 850;
    }
    .card-sub {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 650;
    }
    .card-count {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 5px 9px;
      background: var(--stock-bg);
      color: var(--stock);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }
    .stock-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .store-status {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .store-status.has-stock { border-color: #a7f3d0; }
    .store-status.no-stock { border-color: #fecaca; }
    .store-status.unknown { border-color: #d9e2e0; }
    .store-name {
      min-width: 0;
      overflow-wrap: anywhere;
      color: #24433d;
      font-size: 12px;
      line-height: 1.25;
      font-weight: 750;
    }
    .status-mark {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      background: rgba(255, 255, 255, .64);
    }
    .empty, .error { padding: 14px; color: var(--muted); font-weight: 650; }
    .error { color: #9f1239; background: #fff1f2; }
    @media (max-width: 720px) {
      body { background: #eef5f3; }
      .app { padding: 10px 10px calc(18px + env(safe-area-inset-bottom)); }
      .topbar {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
        padding: 10px 0;
      }
      h1 { font-size: 21px; }
      .meta { font-size: 12px; }
      .actions {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }
      a.button, button {
        min-height: 44px;
        padding: 0 14px;
      }
      .panel { margin-top: 10px; border-radius: 8px; }
      .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px; }
      .stat { min-height: 54px; padding: 7px; }
      .stat-value { font-size: 16px; }
      .filters {
        position: sticky;
        top: 104px;
        z-index: 5;
        padding: 8px;
        background: rgba(255, 255, 255, .96);
        backdrop-filter: blur(12px);
      }
      label { min-height: 36px; padding: 0 12px; font-size: 13px; }
      .table-scroll { display: none; }
      .mobile-list { display: block; }
      .stock-grid { grid-template-columns: 1fr; }
    }
    @media (min-width: 390px) and (max-width: 720px) {
      .stock-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div>
      <h1>Tồn kho Apple</h1>
      <div id="updated" class="meta">Đang tải dữ liệu...</div>
    </div>
    <div class="actions">
      <a class="button" href="/">Bảng báo giá</a>
      <button id="reloadBtn" class="primary">Tải lại</button>
    </div>
  </div>

  <section class="panel">
    <div class="summary" id="stockSummary" aria-live="polite"></div>
    <div class="filters" id="kindFilters"></div>
    <div id="tableMount"></div>
  </section>
</main>

<script src="/shared.js"></script>
<script>
const state = { data: null };

function setupFilters(data) {
  const kinds = [...new Set(data.rows.filter(row => !row.isUpdateRow).map(row => row.kind).filter(Boolean))];
  const root = document.getElementById("kindFilters");
  root.innerHTML = "";
  kinds.forEach(kind => {
    root.insertAdjacentHTML("beforeend", `<label><input type="checkbox" value="${escapeHtml(kind)}" checked> ${escapeHtml(translateVi(kind))}</label>`);
  });
  root.querySelectorAll("input").forEach(input => input.addEventListener("change", render));
}

function render() {
  const data = state.data;
  if (!data) return;
  const stores = data.columns.filter(column => column.store);
  const kinds = checkedSet("kindFilters");
  const products = data.rows.filter(row => !row.isUpdateRow && kinds.has(row.kind));
  const mount = document.getElementById("tableMount");
  renderSummary(data, products, stores);

  if (!stores.length || !products.length) {
    mount.innerHTML = `<div class="empty">Không có dữ liệu tồn kho.</div>`;
    return;
  }

  let tableHtml = `
    <div class="table-scroll">
    <table class="stock-table">
      <thead>
        <tr>
          <th>Sản phẩm</th>
          ${stores.map(store => `<th>${escapeHtml(store.label || store.store)}</th>`).join("")}
        </tr>
      </thead>
      <tbody>
  `;

  products.forEach(row => {
    tableHtml += `
      <tr>
        <td>
          <div class="product">
            <span class="product-name">${escapeHtml(translateVi(row.kind))} ${escapeHtml(row.capacity)}</span>
            <span class="product-sub">${escapeHtml(translateVi(row.color))}</span>
          </div>
        </td>
    `;
    stores.forEach(store => {
      const cell = row.cells.find(item => item.store === store.store);
      const text = stockText(cell?.text);
      tableHtml += `<td class="stock-cell ${stockClass(text)} ${changedClass(data, row, cell)}">${escapeHtml(text)}</td>`;
    });
    tableHtml += `</tr>`;
  });

  tableHtml += `</tbody></table></div>`;
  mount.innerHTML = tableHtml + renderMobileCards(data, products, stores);
}

function renderSummary(data, products, stores) {
  const totalCells = products.length * stores.length;
  const stocked = products.reduce((count, row) => count + stores.filter(store => {
    const text = stockText(row.cells.find(item => item.store === store.store)?.text);
    return stockClass(text) === "has-stock";
  }).length, 0);
  const changed = Object.keys(data.stockChanges || {}).length;
  document.getElementById("stockSummary").innerHTML = `
    <div class="stat">
      <div class="stat-label">Sản phẩm</div>
      <div class="stat-value">${products.length}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Còn hàng</div>
      <div class="stat-value">${stocked}/${totalCells}</div>
    </div>
    <div class="stat">
      <div class="stat-label">Mới đổi</div>
      <div class="stat-value">${changed}</div>
    </div>
  `;
}

function renderMobileCards(data, products, stores) {
  const cards = products.map(row => {
    const cells = stores.map(store => {
      const cell = row.cells.find(item => item.store === store.store);
      const text = stockText(cell?.text);
      return { store, cell, text, className: stockClass(text) };
    });
    const stocked = cells.filter(item => item.className === "has-stock").length;
    return `
      <article class="stock-card">
        <div class="card-head">
          <div class="card-title">
            <div class="card-name">${escapeHtml(translateVi(row.kind))} ${escapeHtml(row.capacity)}</div>
            <div class="card-sub">${escapeHtml(translateVi(row.color))}</div>
          </div>
          <div class="card-count">${stocked}/${stores.length}</div>
        </div>
        <div class="stock-grid">
          ${cells.map(item => `
            <div class="store-status ${item.className} ${changedClass(data, row, item.cell)}">
              <span class="store-name">${escapeHtml(item.store.label || item.store.store)}</span>
              <span class="status-mark" aria-label="${escapeHtml(statusLabel(item.text))}">${escapeHtml(item.text)}</span>
            </div>
          `).join("")}
        </div>
      </article>
    `;
  }).join("");
  return `<div class="mobile-list">${cards}</div>`;
}

function changedClass(data, row, cell) {
  if (!cell?.store) return "";
  const key = [row.kind, row.capacity, row.color, cell.store].map(value => String(value || "").trim()).join("|");
  return data.stockChanges?.[key] ? "changed" : "";
}

function statusLabel(text) {
  const value = String(text || "").trim();
  if (!value || value === "-") return "Chưa rõ";
  if (value === "×") return "Hết hàng";
  return "Còn hàng";
}

async function load(options = {}) {
  const reloadBtn = document.getElementById("reloadBtn");
  reloadBtn.disabled = true;
  try {
    const data = await fetchIsChecker(options);
    state.data = data;
    document.getElementById("updated").textContent = `Cập nhật lúc ${new Date(data.updatedAt).toLocaleString("vi-VN")}`;
    setupFilters(data);
    render();
  } catch (error) {
    document.getElementById("tableMount").innerHTML = `<div class="error">Không thể lấy tồn kho: ${escapeHtml(error.message)}</div>`;
  } finally {
    reloadBtn.disabled = false;
  }
}

document.getElementById("reloadBtn").addEventListener("click", () => load({ force: true }));
load();
setInterval(load, 60000);
</script>
</body>
</html>
